name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            pluginval_bin: xvfb-run -a ./pluginval

    env:
      VST3_PATH: build/MidiDrumHumanizer_artefacts/Release/VST3/MIDI Drum Humanizer.vst3

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate "$VST3_PATH"

      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/MIDI Drum Humanizer"
          cp -R "$VST3_PATH" "dist/MIDI Drum Humanizer/"
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "build/MidiDrumHumanizer_artefacts/Release/AU/MIDI Drum Humanizer.component" "dist/MIDI Drum Humanizer/"
            codesign --force --deep --sign - "dist/MIDI Drum Humanizer/MIDI Drum Humanizer.vst3"
            codesign --force --deep --sign - "dist/MIDI Drum Humanizer/MIDI Drum Humanizer.component"
          fi
          cp README.md "dist/MIDI Drum Humanizer/"

      - uses: actions/upload-artifact@v4
        with:
          name: MIDI-Drum-Humanizer-${{ matrix.name }}
          path: dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip
        run: |
          cd artifacts
          for dir in */; do (cd "$dir" && zip -qr "../../${dir%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
